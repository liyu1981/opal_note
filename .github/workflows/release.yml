name: Release arm64 binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish arm64 release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # web/vendor/reagent is a submodule and is built from source.
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config libssl-dev

      - name: Install root build dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated built-ins
        run: pnpm build:builtins:check

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build web client
        run: pnpm --dir web build

      - name: Build release binary
        env:
          OPALNOTE_SKIP_WEB_BUILD: "1"
        run: cargo build --release --locked

      - name: Package release assets
        id: package
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          TARGET=aarch64-unknown-linux-gnu
          SHA=$(git rev-parse --short=7 HEAD)
          COMMIT_TIME=$(git show -s --format=%ct HEAD)
          ARTIFACT="opalnote-${VERSION}-${TARGET}.tar.gz"

          mkdir -p dist
          cp target/release/opalnote dist/
          cp README.md LICENSE dist/
          tar -C dist -czf "dist/${ARTIFACT}" opalnote README.md LICENSE

          SIZE=$(stat -c '%s' dist/opalnote)
          HASH=$(sha256sum dist/opalnote | awk '{print $1}')
          cat > dist/manifest.json <<JSON
          {
            "version": "${VERSION}",
            "commit": "${SHA}",
            "commit_time": ${COMMIT_TIME},
            "target": "${TARGET}",
            "sha256": "${HASH}",
            "size": ${SIZE}
          }
          JSON

          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/${{ steps.package.outputs.artifact }}" \
              dist/manifest.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              "dist/${{ steps.package.outputs.artifact }}" \
              dist/manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "OpalNote $TAG"
          fi
