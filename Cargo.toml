[package]
name = "opal-note"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A server-first, self-hosted notebook that keeps its index in MnesticDB (Datalog)"
license = "MIT"
default-run = "opalnote"

[[bin]]
name = "opalnote"
path = "src/main.rs"

[dependencies]
# Published as `mnestic`; the library target is still named `cozo` (drop-in CozoDB fork).
# SQLite is bundled so the release binary has no system sqlite dependency.
cozo = { package = "mnestic", version = "0.19.0", default-features = false, features = ["storage-sqlite", "storage-sqlite-src"] }

axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br", "cors", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rquickjs = "0.11.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
