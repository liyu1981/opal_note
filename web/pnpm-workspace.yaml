allowBuilds:
  # Transitive deps of @earendil-works/pi-ai. Their lifecycle scripts are not
  # needed for the browser build, so deny them explicitly instead of leaving
  # pnpm in the "ignored build scripts" error state.
  '@google/genai': false
  protobufjs: false
minimumReleaseAgeExclude:
  - vite@8.3.8
packages:
  # ReAgent is tracked at its Git HEAD (git submodule) and built from source, so
  # the app can use unreleased fixes. `scripts/build-reagent.mjs` produces its
  # `dist/`, which is what the exports point at.
  - vendor/reagent
